name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Suíte de testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trivialists
          POSTGRES_PASSWORD: trivialists
          POSTGRES_DB: trivialists
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trivialists -d trivialists"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: ""
      TEST_DATABASE_URL: postgresql://trivialists:trivialists@localhost:5432/trivialists

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -q
