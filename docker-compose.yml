services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trivialists
      POSTGRES_PASSWORD: trivialists
      POSTGRES_DB: trivialists
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivialists -d trivialists"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trivialists:trivialists@db:5432/trivialists}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-trivialists_apenas_desenvolvimento_altere_em_producao}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-30}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: ""
      TEST_DATABASE_URL: postgresql://trivialists:trivialists@db:5432/trivialists
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres_data:
